name: Trello - Pull Requests

# Anexa o PR ao card do Trello (Odontra/<card>) e move o card conforme o PR anda.
# Precisa dos secrets TRELLO_KEY e TRELLO_TOKEN e da variável TRELLO_BOARD (ver docs/git-flow.md).
# Enquanto não estiverem configurados, o job só avisa e passa: não é check obrigatório.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, ready_for_review, edited, closed]

concurrency:
  group: trello-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trello:
    name: trello
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Autoteste das regras
        run: node scripts/trello-pr.mjs --selftest
      - name: Atualizar o card
        run: node scripts/trello-pr.mjs
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD: ${{ vars.TRELLO_BOARD }}
          TRELLO_LISTA_PR: ${{ vars.TRELLO_LISTA_PR }}
          TRELLO_LISTA_MERGE: ${{ vars.TRELLO_LISTA_MERGE }}
          TRELLO_LISTA_FECHADO: ${{ vars.TRELLO_LISTA_FECHADO }}
